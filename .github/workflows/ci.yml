name: Tiny Civilization CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Audit production dependency security
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Production smoke wipes test-results/. Preserve each observer evidence generation.
      - name: Preserve observer V01-A and V01-B camera evidence
        if: always()
        run: |
          mkdir -p observer-v01-a-evidence observer-v01-b-evidence
          if [ -d test-results ]; then
            find test-results -type f -name 'v01-a-*' -exec cp '{}' observer-v01-a-evidence/ ';'
            find test-results -type f -name 'v01-b-*' -exec cp '{}' observer-v01-b-evidence/ ';'
          fi
      - name: Build for GitHub Pages project path
        run: GITHUB_PAGES=true npm run build
      - name: Smoke-test the actual production build
        run: PLAYWRIGHT_PRODUCTION=true npm run test:e2e -- tests/e2e/release.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-07-release-evidence
          path: |
            test-results/
            playwright-report/
            observer-v01-a-evidence/
            observer-v01-b-evidence/
            dist/
          if-no-files-found: ignore
          retention-days: 7
