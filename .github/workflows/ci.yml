name: Tiny Civilization CI
on:
  push:
    branches: [main, feat/phase-07-release]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Audit production dependency security
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build for GitHub Pages project path
        run: GITHUB_PAGES=true npm run build
      - name: Smoke-test the actual production build
        run: PLAYWRIGHT_PRODUCTION=true npm run test:e2e -- tests/e2e/release.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-07-release-evidence
          path: |
            test-results/
            playwright-report/
            dist/
          if-no-files-found: ignore
          retention-days: 7
