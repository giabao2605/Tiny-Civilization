name: T06-D Headless Browser Profile
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/t06d-*.spec.ts'
      - 'src/game/**'
      - 'src/app/**'
      - '.github/workflows/t06-d-profile.yml'
concurrency:
  group: t06-d-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 00e8706998d3c55d195ad06242ad1eb3c01d7b46
          path: t06d-baseline
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Hardware and runtime disclosure
        run: |
          uname -a
          node --version
          npm --version
          lscpu | grep -E 'Model name|CPU\\(s\\)|Vendor ID' || true
          free -h || true
          command -v glxinfo >/dev/null && glxinfo -B || echo 'GPU driver info unavailable / headless'
      - run: npx playwright install --with-deps chromium
      - name: Run baseline on same runner
        working-directory: t06d-baseline
        env:
          T06D_RUN: baseline-main-00e87069
        run: |
          cp ../tests/e2e/t06d-render-benchmark.spec.ts tests/e2e/
          ln -s ../node_modules node_modules
          npx playwright test tests/e2e/t06d-render-benchmark.spec.ts --workers=1 --retries=0 --reporter=line
      - name: Preserve baseline artifacts
        if: always()
        run: |
          mkdir -p t06d-baseline-results
          if [ -d t06d-baseline/test-results ]; then cp -r t06d-baseline/test-results/. t06d-baseline-results/; fi
      - name: Run candidate under the same runner
        env:
          T06D_RUN: candidate-${{ github.sha }}
        run: npx playwright test tests/e2e/t06d-render-benchmark.spec.ts tests/e2e/t06d-forest-culling.spec.ts --workers=1 --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t06-d-paired-headless-chromium
          path: |
            t06d-baseline-results/
            test-results/
          retention-days: 7
