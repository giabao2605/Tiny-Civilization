name: Tiny Civilization Pages
on:
  push:
    branches: [main, feat/phase-07-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build for project Pages base path
        run: GITHUB_PAGES=true npm run build
      - name: Browser smoke against built production site
        run: PLAYWRIGHT_PRODUCTION=true npm run test:e2e -- tests/e2e/release.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-release-checks
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LIVE_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Require actual deployment URL
        run: test -n "$LIVE_PAGES_URL"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke against real deployed URL
        run: npx playwright test tests/e2e/live-pages.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pages-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
